name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust and lint tools
        run: rustup toolchain install 1.96 --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        run: cargo +1.96 fmt --check
      - name: Lint
        run: cargo +1.96 clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo +1.96 test --locked
      - name: Build container
        run: docker build --tag suunto-mcp:ci .

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: docker://ghcr.io/gitleaks/gitleaks:latest
        with:
          args: detect --source=/github/workspace --verbose
